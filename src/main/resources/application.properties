spring.application.name=EComTest

spring.datasource.url=jdbc:h2:mem:ecomtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

security.jwt.secret=${JWT_SECRET:ecomtest-dev-secret-key-please-change-me-0123456789abcdef}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
