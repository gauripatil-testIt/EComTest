spring.application.name=EComTest

spring.datasource.url=jdbc:h2:mem:ecomtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.security.staff.username=${APP_STAFF_USERNAME:staff}
app.security.staff.password=${APP_STAFF_PASSWORD:staff123}
app.security.customer.username=${APP_CUSTOMER_USERNAME:customer}
app.security.customer.password=${APP_CUSTOMER_PASSWORD:customer123}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
