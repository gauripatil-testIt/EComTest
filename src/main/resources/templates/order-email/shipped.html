<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Order Shipped</title>
</head>
<body>
    <h1>Your order is on its way, <span th:text="${customerName}">Customer</span>!</h1>
    <p>Order <strong th:text="${orderId}">1</strong> has been <strong>shipped</strong>.</p>
    <table>
        <tr><td>Order ID:</td><td th:text="${orderId}">1</td></tr>
        <tr><td>Product:</td><td th:text="${productName}">Product</td></tr>
        <tr><td>Quantity:</td><td th:text="${quantity}">1</td></tr>
        <tr><td>Unit Price:</td><td th:text="${unitPrice}">0.00</td></tr>
        <tr><td>Total:</td><td th:text="${total}">0.00</td></tr>
    </table>
    <div th:if="${trackingNumber != null}">
        <p>Tracking Number: <span th:text="${trackingNumber}">TRACK123</span></p>
    </div>
    <div th:if="${carrier != null}">
        <p>Carrier: <span th:text="${carrier}">Carrier</span></p>
    </div>
</body>
</html>
