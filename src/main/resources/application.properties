spring.application.name=EComTest

spring.datasource.url=jdbc:h2:mem:ecomtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

app.jwt.secret=${JWT_SECRET:change-this-development-only-secret-key-please-rotate-in-prod-0123456789}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}

app.admin.bootstrap-username=${ADMIN_BOOTSTRAP_USERNAME:admin}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:change-this-admin-password}
