spring.application.name=EComTest

spring.datasource.url=jdbc:h2:mem:ecomtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

# SMTP configuration (placeholders - supply real values per environment)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Async email executor settings
email.executor.core-pool-size=2
email.executor.max-pool-size=5
email.executor.queue-capacity=100
