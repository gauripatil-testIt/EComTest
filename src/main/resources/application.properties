spring.application.name=EComTest

spring.datasource.url=jdbc:h2:mem:ecomtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

app.security.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-change-this-dev-only-secret}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:admin123}
