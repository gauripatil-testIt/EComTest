spring.application.name=EComTest

spring.datasource.url=jdbc:h2:mem:ecomtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-please-32chars}
app.jwt.expiration-ms=3600000

# Bootstrap admin
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
